<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email to Print — Impressora 3D</title>
<style>
:root{--bg1:#e9edf3;--bg2:#c9d1dd;--panel:rgba(255,255,255,.86);--fg:#1c2330;--mut:#5d6878;--line:#c3ccd8;--acc:#2f6df6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#232a36;--bg2:#10141b;--panel:rgba(28,34,45,.88);--fg:#e8ecf3;--mut:#9aa5b5;--line:#3a4352;--acc:#6e9bff}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:radial-gradient(circle at 50% 35%,var(--bg1),var(--bg2))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
#panel{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:min(300px,calc(100vw - 24px));background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;font-size:13px;overflow:hidden}
#panel summary{padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;font-weight:600}
#panel summary::-webkit-details-marker{display:none}
#dot{width:9px;height:9px;border-radius:50%;background:#d9534f;flex:none}
#dot.ok{background:#3fb950}#dot.wait{background:#e3b341}
#st{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px}
.body{padding:0 12px 12px;display:grid;gap:8px}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:70px;resize:vertical}
input[type=file]{font-size:12px;color:var(--mut);width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px;background:var(--acc);color:#fff;cursor:pointer}
label{font-size:11px;color:var(--mut)}
#hint{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-size:12px;color:var(--mut);pointer-events:none}
select{padding:7px;font-size:13px}select option{color:#000}
#panel{max-height:calc(100vh - 24px);overflow:auto}
#intel{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:none;font-size:12px;line-height:1.55;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intel"></div>
<div id="hint">Arraste para girar · role para aproximar</div>
<details id="panel" open>
  <summary><span id="dot"></span>Painel de teste<span id="st">Status: desconectado</span></summary>
  <div class="body">
    <textarea id="txt" placeholder="Digite o texto a imprimir…"></textarea>
    <input type="file" id="file" accept="image/*">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <select id="o_cor"><option>Colorido</option><option>Preto e Branco</option><option>Sépia</option><option>Negativo</option><option>Alto Contraste</option></select>
      <select id="o_papel"><option>A4</option><option>A5</option><option>A3</option><option>A2</option><option>A1</option><option>Ofício / Legal</option><option>Carta / Letter</option><option>Envelope</option></select>
      <select id="o_orient"><option>Retrato</option><option>Paisagem</option></select>
      <select id="o_dup"><option value="0">Um lado</option><option value="1">Frente e verso</option></select>
      <select id="o_nf"><option value="1">1 por folha</option><option value="2">2 por folha</option><option value="4">4 por folha</option></select>
      <input type="number" id="o_cop" min="1" max="10" value="1" title="Cópias">
    </div>
    <button id="go">Imprimir</button>
    <label>ID do cliente Google (do passo a passo)</label>
    <input type="text" id="cid" spellcheck="false" placeholder="xxxx.apps.googleusercontent.com">
    <button id="gmail">Conectar Gmail</button>
  </div>
</details>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const DEFAULT_TOPIC="emailtoprint/2m02lch/impressora"; // troque por algo único e difícil de adivinhar
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081"];

/* ---------- Cena ---------- */
const canvas=$("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(4.6,4.2,8);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(0,.4,1.4);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=3;controls.maxDistance=14;

scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,.75));
const sun=new THREE.DirectionalLight(0xffffff,.9);
sun.position.set(4,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6});scene.add(sun);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.25}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

const mat=(c,r=.5,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(w,h,d,m,x,y,z,parent){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;(parent||printer).add(b);return b}

const printer=new THREE.Group();scene.add(printer);
const W=3,H=1.2,D=2.2;
box(W,H,D,mat(0xeceff4,.45),0,H/2,0);                    // corpo
box(W+.06,.12,D+.06,mat(0xd5dae3,.5),0,H+.06,0);          // tampa
box(W-.5,.04,.9,mat(0x2b3140,.3),0,H+.14,-.6);            // vidro do scanner
box(1.9,.05,.9,mat(0xffffff,.8),0,H+.5,-.95).rotation.x=-.5; // bandeja traseira de entrada
box(1.9,.04,.5,mat(0xf6f6f6,.9),0,H+.3,-.72);              // pilha de folhas
box(1.9,.06,2.6,mat(0x2b3140,.6),0,.28,2.4);               // bandeja de saída
box(1.55,.22,.04,mat(0x0e1118,.9),0,.33,D/2+.005);         // fenda
box(.9,.05,.5,mat(0x3a4254,.4),-.9,H+.14,.6);              // painel de controle
const led=box(.1,.03,.1,mat(0x3fb950,.3),-1.1,H+.18,.6);led.material.emissive=new THREE.Color(0x3fb950);
box(.14,.04,.14,mat(0x2f6df6,.4),-.8,H+.18,.6);
[[-1.3,-.9],[1.3,-.9],[-1.3,.9],[1.3,.9]].forEach(p=>box(.25,.08,.25,mat(0x20242d,.8),p[0],.04,p[1]));

/* ---------- Folha ---------- */
let PW=1.414,PL=2.0;const PY=.33;
let paper=null,anim=null,busy=false;

function wrap(ctx,text,maxW){
  const out=[];
  text.split(/\r?\n/).forEach(par=>{
    let line="";
    par.split(" ").forEach(w=>{
      const t=line?line+" "+w:w;
      if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t;
    });
    out.push(line);
  });
  return out;
}

const PAPEIS={"A1":[594,841],"A2":[420,594],"A3":[297,420],"A4":[210,297],"A5":[148,210],"Ofício / Legal":[216,356],"Carta / Letter":[216,279],"Envelope":[110,220]};
const CFG0={copias:1,cor:"Colorido",papel:"A4",orient:"Retrato",duplex:false,paginas:"Tudo",porFolha:1};

function drawCell(g,x,y,w,h,texto,img){
  const m=w*.075,fs=Math.max(11,w*.038);
  if(img){
    const k=Math.min(w/img.width,h/img.height),iw=img.width*k,ih=img.height*k;
    g.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
    if(texto){
      g.font=fs+"px system-ui,sans-serif";
      const L=wrap(g,texto,w-2*m).slice(0,6),bh=L.length*fs*1.45+fs*1.6;
      g.fillStyle="rgba(0,0,0,.55)";g.fillRect(x,y+h-bh,w,bh);
      g.fillStyle="#fff";L.forEach((l,i)=>g.fillText(l,x+m,y+h-bh+fs*1.9+i*fs*1.45));
    }
    return;
  }
  g.fillStyle="#8a93a3";g.font="600 "+fs*.67+"px system-ui,sans-serif";
  g.fillText("EMAIL TO PRINT",x+m,y+m);
  g.fillStyle="#d6dbe3";g.fillRect(x+m,y+m+fs*.9,w-2*m,Math.max(1,fs*.07));
  g.fillStyle="#1c2330";g.font=fs+"px system-ui,sans-serif";
  const lh=fs*1.45,mx=Math.max(1,Math.floor((h-2*m-fs*2)/lh));
  wrap(g,texto,w-2*m).slice(0,mx).forEach((l,i)=>g.fillText(l,x+m,y+m+fs*2.6+i*lh));
}

function drawSheet(texto,imgs,cfg){
  const d=PAPEIS[cfg.papel]||PAPEIS.A4,W=794,H=Math.round(794*d[1]/d[0]);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
  const land=cfg.orient==="Paisagem",cw=land?H:W,ch=land?W:H;
  const cc=document.createElement("canvas");cc.width=cw;cc.height=ch;
  const c=cc.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,cw,ch);
  const n=cfg.porFolha,cols=n===4?2:(n===2&&land?2:1),rows=n===4?2:(n===2&&!land?2:1);
  const w=cw/cols,h=ch/rows;
  if(n>1){c.fillStyle="#d6dbe3";for(let i=1;i<cols;i++)c.fillRect(i*w-1,0,2,ch);for(let i=1;i<rows;i++)c.fillRect(0,i*h-1,cw,2)}
  for(let i=0;i<cols*rows;i++){
    if(imgs.length&&!imgs[i])break;
    if(!imgs.length&&i>0)break;
    drawCell(c,(i%cols)*w+4,Math.floor(i/cols)*h+4,w-8,h-8,i===0?texto:"",imgs[i]||null);
  }
  if(land){g.save();g.translate(W,0);g.rotate(Math.PI/2);g.drawImage(cc,0,0);g.restore()}
  else g.drawImage(cc,0,0);
  return cv;
}

function setStatus(){}
function limpar(){
  if(!paper)return;
  scene.remove(paper);
  paper.traverse(o=>{if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}if(o.geometry)o.geometry.dispose()});
  paper=null;
}
function mostrar(c){
  $("intel").innerHTML="<b>Inteligência do sistema</b><br>Cópias: "+c.copias+"<br>Cor: "+c.cor+"<br>Papel: "+c.papel+"<br>Orientação: "+c.orient+"<br>Frente e verso: "+(c.duplex?"Sim":"Não")+"<br>Páginas: "+c.paginas+"<br>Por folha: "+c.porFolha;
  $("intel").style.display="block";
}

function print(texto,front,back,cfg){
  cfg=Object.assign({},CFG0,cfg||{});front=front||[];back=back||[];
  texto=(texto||"").trim();
  if(!texto&&!front.length){busy=false;return}
  limpar();
  const d=PAPEIS[cfg.papel]||PAPEIS.A4,e=Math.min(1.2,Math.sqrt(Math.max(d[0],d[1])/297));
  PL=2.0*e;PW=PL*d[0]/d[1];
  paper=new THREE.Group();
  const geo=new THREE.PlaneGeometry(PW,PL);
  const mk=cv=>{const t=new THREE.CanvasTexture(cv);t.anisotropy=8;return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:t,roughness:.9}))};
  const fr=mk(drawSheet(texto,front,cfg));fr.rotation.x=-Math.PI/2;fr.castShadow=true;paper.add(fr);
  if(cfg.duplex){
    const bg=new THREE.Group(),bk=mk(drawSheet("",back,cfg));
    bk.rotation.x=-Math.PI/2;bg.rotation.z=Math.PI;bg.position.y=-.002;bg.add(bk);paper.add(bg);
  }
  paper.position.y=PY;
  scene.add(paper);
  mostrar(cfg);
  anim={t0:performance.now(),dur:6000,cfg:cfg,fl:0};
  placePaper(0);
}

function placePaper(k){
  const lead=.9+k*(PL+.3);
  paper.position.x=0;paper.position.z=lead-PL/2;
}

function loadImg(src,cb){
  const i=new Image();
  if(!src.startsWith("data:"))i.crossOrigin="anonymous";
  i.onload=()=>cb(i);
  i.onerror=()=>cb(null);
  i.src=src;
}
const carregar=srcs=>Promise.all((srcs||[]).map(s=>new Promise(r=>loadImg(s,r))));
function printFrom(texto,front,back,cfg){
  if(typeof front==="string")front=front?[front]:[];
  Promise.all([carregar(front),carregar(back)]).then(r=>{
    const f=r[0].filter(Boolean),b=r[1].filter(Boolean);
    print(texto||((front&&front.length&&!f.length)?"(imagem não pôde ser carregada)":""),f,b,cfg);
  });
}

/* ---------- Fila ---------- */
const fila=[];
function selecionar(imgs,spec){
  if(!spec||spec==="Tudo")return imgs;
  if(spec==="atual")return imgs.slice(0,1);
  const ok=new Set();
  spec.split(",").forEach(p=>{
    const r=p.split(/[-_]/).map(x=>parseInt(x)).filter(x=>!isNaN(x));
    if(r.length===1)ok.add(r[0]);
    else if(r.length>1)for(let i=r[0];i<=r[1];i++)ok.add(i);
  });
  const sel=imgs.filter((_,i)=>ok.has(i+1));
  return sel.length?sel:imgs;
}
function criarJob(texto,imgs,cfg){
  imgs=selecionar(imgs,cfg.paginas);
  const faces=[];
  for(let i=0;i<imgs.length;i+=cfg.porFolha)faces.push(imgs.slice(i,i+cfg.porFolha));
  if(!faces.length)faces.push([]);
  const folhas=[],passo=cfg.duplex?2:1;
  for(let i=0;i<faces.length;i+=passo)folhas.push([faces[i],faces[i+1]||[]]);
  const n=Math.min(Math.max(cfg.copias,1),10);
  for(let c=0;c<n;c++)folhas.forEach((f,i)=>fila.push({t:i===0?texto:"",f:f[0],b:f[1],cfg:cfg}));
  proximo();
}
function proximo(){
  if(busy||!fila.length)return;
  busy=true;const j=fila.shift();printFrom(j.t,j.f,j.b,j.cfg);
}

/* ---------- Painel manual ---------- */
let fileSrc=null;
$("file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f){fileSrc=null;return}
  const r=new FileReader();r.onload=()=>fileSrc=r.result;r.readAsDataURL(f);
});
$("go").addEventListener("click",async()=>{
  const cfg=Object.assign({},CFG0,{
    copias:parseInt($("o_cop").value)||1,cor:$("o_cor").value,papel:$("o_papel").value,
    orient:$("o_orient").value,duplex:$("o_dup").value==="1",porFolha:parseInt($("o_nf").value)
  });
  const imgs=fileSrc?[await prepararImg(fileSrc,cfg.cor)]:[];
  criarJob($("txt").value.trim(),imgs,cfg);
});

/* ---------- Gmail ---------- */
const GMAIL="https://gmail.googleapis.com/gmail/v1/users/me/";
let token=null,timer=null,primeira=true;const vistos2=new Set();
function status(s,cls){$("st").textContent="Status: "+s;$("dot").className=cls||""}
function connect(){}
try{$("cid").value=localStorage.getItem("e2p_cid")||""}catch(e){}

$("gmail").addEventListener("click",()=>{
  const id=$("cid").value.trim();
  if(!id){status("falta o ID do cliente");return}
  try{localStorage.setItem("e2p_cid",id)}catch(e){}
  if(!window.google||!google.accounts){status("Google não carregou (internet?)");return}
  google.accounts.oauth2.initTokenClient({
    client_id:id,scope:"https://www.googleapis.com/auth/gmail.readonly",
    callback:r=>{
      if(r.error){status("erro: "+r.error);return}
      token=r.access_token;status("conectado","ok");$("panel").open=false;
      if(!timer){checar();timer=setInterval(checar,10000)}
    }
  }).requestAccessToken();
});

async function api(path){
  const r=await fetch(GMAIL+path,{headers:{Authorization:"Bearer "+token}});
  if(r.status===401){token=null;status("sessão expirou — clique em Conectar Gmail","wait");$("panel").open=true;throw new Error("401")}
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
const b64=s=>s.replace(/-/g,"+").replace(/_/g,"/");
const txt=s=>new TextDecoder().decode(Uint8Array.from(atob(b64(s)),c=>c.charCodeAt(0)));
function achar(p,out){out.push(p);(p.parts||[]).forEach(x=>achar(x,out));return out}

async function checar(){
  if(!token)return;
  try{
    const l=await api("messages?labelIds=INBOX&maxResults=5");
    const ids=(l.messages||[]).map(m=>m.id);
    let novos;
    if(primeira){primeira=false;novos=ids.slice(0,1);ids.forEach(i=>vistos2.add(i))}
    else novos=ids.filter(i=>!vistos2.has(i)).reverse();
    for(const id of novos){vistos2.add(id);await processar(id)}
  }catch(e){}
}

function interpretar(t){
  t=(t||"").toLowerCase();
  const c=Object.assign({},CFG0);
  const tem=(...a)=>a.some(x=>t.includes(x));
  const pal=(...a)=>a.some(x=>new RegExp("(^|[^a-z0-9])"+x+"([^a-z0-9]|$)").test(t));
  const m=t.match(/(\d+)\s*(?:copia|copias|cópia|cópias|via|vias|copy|copies)/);
  if(m)c.copias=parseInt(m[1]);
  if(tem("sepia","sépia","vintage"))c.cor="Sépia";
  else if(tem("negativo","inverter","invert"))c.cor="Negativo";
  else if(tem("contraste","high contrast"))c.cor="Alto Contraste";
  else if(tem("preto e branco","p&b","black and white")||pal("pb","bw"))c.cor="Preto e Branco";
  else if(tem("color")||pal("cor"))c.cor="Colorido";
  const p=["a1","a2","a3","a4","a5"].find(x=>pal(x));
  if(p)c.papel=p.toUpperCase();
  else if(tem("oficio","ofício","legal"))c.papel="Ofício / Legal";
  else if(tem("carta","letter"))c.papel="Carta / Letter";
  else if(tem("envelope"))c.papel="Envelope";
  if(tem("paisagem","horizontal","landscape"))c.orient="Paisagem";
  else if(tem("retrato","vertical","portrait"))c.orient="Retrato";
  if(tem("frente e verso","frente-verso","duplex","double sided","two sided"))c.duplex=true;
  const mp=t.match(/(?:paginas?|páginas?|pages?)\s*([\d\-_,]+)/);
  if(mp&&mp[1].replace(/[,_\-]+$/,""))c.paginas=mp[1].replace(/[,_\-]+$/,"");
  else if(tem("pagina atual","página atual","current page"))c.paginas="atual";
  if(tem("2 paginas por folha","2 páginas por folha","2 por folha","2 pages per sheet"))c.porFolha=2;
  else if(tem("4 paginas por folha","4 páginas por folha","4 por folha","4 pages per sheet"))c.porFolha=4;
  return c;
}

function prepararImg(url,cor){
  return new Promise(res=>{
    const i=new Image();
    i.onload=()=>{
      const e=Math.min(1,1000/Math.max(i.width,i.height));
      const w=Math.max(1,Math.round(i.width*e)),h=Math.max(1,Math.round(i.height*e));
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(i,0,0,w,h);
      if(cor!=="Colorido"){
        const d=g.getImageData(0,0,w,h),a=d.data;
        for(let k=0;k<a.length;k+=4){
          const R=a[k],G=a[k+1],B=a[k+2],z=R*.3+G*.59+B*.11;
          let r=z,gg=z,b=z;
          if(cor==="Sépia"){r=R*.393+G*.769+B*.189;gg=R*.349+G*.686+B*.168;b=R*.272+G*.534+B*.131}
          else if(cor==="Negativo"){r=255-R;gg=255-G;b=255-B}
          else if(cor==="Alto Contraste"){r=gg=b=z>128?255:0}
          a[k]=r;a[k+1]=gg;a[k+2]=b;
        }
        g.putImageData(d,0,0);
      }
      res(cv.toDataURL("image/jpeg",.85));
    };
    i.onerror=()=>res(url);
    i.src=url;
  });
}

async function processar(id){
  const m=await api("messages/"+id+"?format=full");
  const h=n=>((m.payload.headers||[]).find(x=>x.name.toLowerCase()===n)||{}).value||"";
  const assunto=h("subject");
  const partes=achar(m.payload,[]);
  const tp=partes.find(p=>p.mimeType==="text/plain"&&p.body&&p.body.data);
  const corpo=tp?txt(tp.body.data).trim():"";
  const cfg=interpretar(corpo+" "+assunto);
  if(cfg.copias<=0)return;
  const imgs=[],outros=[];
  for(const p of partes){
    if(!p.filename)continue;
    if(/^image\//.test(p.mimeType)){
      let d=p.body.data;
      if(!d&&p.body.attachmentId)d=(await api("messages/"+id+"/attachments/"+p.body.attachmentId)).data;
      if(d)imgs.push(await prepararImg("data:"+p.mimeType+";base64,"+b64(d),cfg.cor));
    }else outros.push(p.filename);
  }
  if(imgs.length)return criarJob("",imgs,cfg);
  let t=assunto+"\n\n"+corpo;
  if(outros.length)t+="\n\n[Anexos: "+outros.join(", ")+"]";
  criarJob(t,[],cfg);
}

/* ---------- Loop ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(now){
  requestAnimationFrame(frame);
  if(anim&&paper){
    const t=Math.min((now-anim.t0)/anim.dur,1);
    // avanço em "passos" para parecer cabeçote de impressão
    const step=Math.floor(ease(t)*60)/60;
    placePaper(step);
    const dup=anim.cfg.duplex;
    if(t>=1&&dup&&!anim.fl)anim.fl=now+800;
    const fk=(dup&&anim.fl)?Math.min(Math.max((now-anim.fl)/2200,0),1):0;
    paper.rotation.z=ease(fk)*Math.PI;
    paper.position.y=PY+Math.sin(ease(fk)*Math.PI)*1.0;
    printer.position.x=t<1?Math.sin(now*.09)*.006:0;
    printer.position.y=t<1?Math.sin(now*.13)*.004:0;
    led.material.emissive.setHex(t<1&&Math.floor(now/120)%2?0xffb020:0x3fb950);
    led.material.color.copy(led.material.emissive);
    if(t>=1&&(!dup||fk>=1)){anim=null;setTimeout(()=>{busy=false;proximo()},2500)}
  }
  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
